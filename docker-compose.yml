version: '3.9'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: webmap_postgis
    environment:
      POSTGRES_DB: landmap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"        # để anh connect từ ngoài (DBeaver, psql)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: webmap_api
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: landmap
      PGUSER: postgres
      PGPASSWORD: postgres
      PORT: 3000
    depends_on:
      - db
    ports:
      - "3000:3000"
    # nếu muốn reload nhanh khi dev:
    # volumes:
    #   - ./api:/usr/src/app
    volumes:
      - ./api:/usr/src/app          # gắn toàn bộ mã nguồn (server.js, public, v.v.)
      - /usr/src/app/node_modules
    

  pgadmin:
    image: dpage/pgadmin4
    container_name: webmap_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
